<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cute-moji ♡</title>

<!-- かわいい日本語Webフォント -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Yomogi&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 10% 10%, #ffe5ef 0 2px, transparent 3px),
    #fff8fb;
  color: #6f5964;
  font-family:
    "Zen Maru Gothic",
    sans-serif;
}

.wrapper {
  width: min(92%, 620px);
  margin: auto;
  padding: 28px 0 50px;
}

header {
  text-align: center;
  margin-bottom: 22px;
}

.logo-small {
  color: #d39ab1;
  font-size: 11px;
  letter-spacing: 3px;
}

h1 {
  margin: 6px 0;
  color: #c9799a;
  font-family: "Mochiy Pop One", sans-serif;
  font-size: 30px;
}

header p {
  margin: 0;
  color: #ad8999;
  font-size: 12px;
}

.card {
  background: rgba(255,255,255,.95);
  border: 1px solid #f1dce6;
  border-radius: 25px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 25px rgba(190,130,160,.08);
}

.label {
  display: block;
  color: #b87591;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 9px;
}

textarea {
  width: 100%;
  min-height: 105px;
  padding: 14px;
  resize: vertical;
  border: 1px solid #efd8e3;
  border-radius: 17px;
  outline: none;
  background: #fffafd;
  color: #6e5863;
  font-family: "Zen Maru Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.7;
}

textarea:focus {
  border-color: #d89db5;
}

.control {
  margin-top: 17px;
}

.control-title {
  display: block;
  margin-bottom: 7px;
  color: #ad718d;
  font-size: 12px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 11px;
  border: 1px solid #eed8e2;
  border-radius: 13px;
  background: #fffafd;
  color: #6e5863;
  font-family: inherit;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="range"] {
  flex: 1;
  accent-color: #d89bb4;
}

input[type="color"] {
  width: 52px;
  height: 38px;
  padding: 2px;
  border: 1px solid #ead2dd;
  border-radius: 10px;
  background: white;
}

.value {
  width: 45px;
  text-align: right;
  font-size: 12px;
  color: #b27690;
}

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 17px;
  font-size: 13px;
}

.check input {
  accent-color: #d596b0;
}

.preview {
  width: 100%;
  overflow: hidden;
  text-align: center;
}

canvas {
  width: 100%;
  max-width: 100%;
  height: auto;
  border-radius: 17px;

  background-image:
    linear-gradient(45deg, #f2e7ec 25%, transparent 25%),
    linear-gradient(-45deg, #f2e7ec 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #f2e7ec 75%),
    linear-gradient(-45deg, transparent 75%, #f2e7ec 75%);

  background-size: 24px 24px;
  background-position:
    0 0,
    0 12px,
    12px -12px,
    -12px 0;

  border: 1px solid #efdce5;
}

button {
  width: 100%;
  border: 0;
  border-radius: 999px;
  padding: 14px;
  margin-top: 16px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

.make {
  background: #d79ab3;
  color: white;
}

.save {
  background: #f3d5e1;
  color: #9d647d;
}

.message {
  min-height: 18px;
  margin-top: 9px;
  text-align: center;
  color: #c17d99;
  font-size: 11px;
}

footer {
  text-align: center;
  color: #c9a7b5;
  font-size: 10px;
  letter-spacing: 1px;
}

</style>
</head>

<body>

<div class="wrapper">

<header>

  <div class="logo-small">
    ♡ CUTE TEXT MATERIAL MAKER ♡
  </div>

  <h1>Cute-moji</h1>

  <p>
    文字をかわいい画像素材にしよう 🎀
  </p>

</header>


<!-- 入力 -->

<section class="card">

  <label class="label">
    ♡ 文字を入力
  </label>

  <textarea
    id="text"
    placeholder="例：お誕生日おめでとう♡"
  ></textarea>


  <!-- フォント -->

  <div class="control">

    <span class="control-title">
      ♡ 文字の雰囲気
    </span>

    <select id="font">

      <option value="mochiy">
        🎀 ぷっくり量産型
      </option>

      <option value="yomogi">
        🌷 ゆるふわ手書き
      </option>

      <option value="klee">
        ♡ おしゃれ手書き
      </option>

      <option value="maru">
        🩷 ふわふわ丸文字
      </option>

    </select>

  </div>


  <!-- サイズ -->

  <div class="control">

    <span class="control-title">
      ♡ 文字サイズ
    </span>

    <div class="row">

      <input
        id="size"
        type="range"
        min="35"
        max="120"
        value="65"
      >

      <span
        id="sizeValue"
        class="value"
      >
        65px
      </span>

    </div>

  </div>


  <!-- 色 -->

  <div class="control">

    <span class="control-title">
      ♡ 文字色
    </span>

    <div class="row">

      <input
        id="color"
        type="color"
        value="#d58ba8"
      >

      <span>
        好きな色にできるよ ♡
      </span>

    </div>

  </div>


  <!-- 透明 -->

  <label class="check">

    <input
      id="transparent"
      type="checkbox"
      checked
    >

    背景を透明にする ♡

  </label>


  <button
    class="make"
    onclick="draw()"
  >
    ♡ 画像を作る ♡
  </button>

</section>


<!-- プレビュー -->

<section class="card">

  <label class="label">
    ♡ プレビュー
  </label>

  <div class="preview">

    <canvas
      id="canvas"
      width="1200"
      height="600"
    ></canvas>

  </div>


  <button
    class="save"
    onclick="save()"
  >
    ♡ PNG画像として保存する ♡
  </button>


  <div
    id="message"
    class="message"
  ></div>

</section>


<footer>
  made with ♡ Cute-moji
</footer>

</div>


<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const text =
  document.getElementById("text");

const font =
  document.getElementById("font");

const size =
  document.getElementById("size");

const sizeValue =
  document.getElementById("sizeValue");

const color =
  document.getElementById("color");

const transparent =
  document.getElementById("transparent");

const message =
  document.getElementById("message");


/* フォント名 */

function getFontName() {

  switch (font.value) {

    case "mochiy":
      return "Mochiy Pop One";

    case "yomogi":
      return "Yomogi";

    case "klee":
      return "Klee One";

    case "maru":
      return "Zen Maru Gothic";

    default:
      return "Zen Maru Gothic";

  }

}


/* 文字を改行 */

function makeLines(str, maxWidth) {

  const lines = [];

  let current = "";

  for (const char of str) {

    const test =
      current + char;

    if (
      ctx.measureText(test).width > maxWidth &&
      current !== ""
    ) {

      lines.push(current);

      current = char;

    } else {

      current = test;

    }

  }

  if (current) {
    lines.push(current);
  }

  return lines;

}


/* 画像を描画 */

async function draw() {

  /*
    Google Fontsの読み込みが
    完了してからCanvasに描く
  */

  await document.fonts.ready;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (!transparent.checked) {

    ctx.fillStyle =
      "#fff7fb";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  const fontSize =
    Number(size.value);

  const fontName =
    getFontName();


  ctx.font =
    `${fontSize}px "${fontName}"`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  const input =
    text.value.trim() ||
    "ここに文字が入るよ ♡";


  const lines =
    makeLines(
      input,
      1050
    );


  const lineHeight =
    fontSize * 1.45;


  const totalHeight =
    lines.length * lineHeight;


  const startY =
    canvas.height / 2 -
    totalHeight / 2 +
    lineHeight / 2;


  lines.forEach((line, index) => {

    const y =
      startY +
      index * lineHeight;


    /*
      白いふちをつける
      → 写真に貼ったとき見やすい
    */

    ctx.lineWidth = 18;

    ctx.strokeStyle =
      "rgba(255,255,255,.95)";

    ctx.strokeText(
      line,
      canvas.width / 2,
      y
    );


    ctx.fillStyle =
      color.value;

    ctx.fillText(
      line,
      canvas.width / 2,
      y
    );

  });

}


/* 保存 */

function save() {

  const link =
    document.createElement("a");

  link.download =
    "Cute-moji.png";

  link.href =
    canvas.toDataURL(
      "image/png"
    );

  link.click();


  message.textContent =
    "保存したよ ♡";

  setTimeout(() => {

    message.textContent = "";

  }, 2000);

}


/* サイズ表示 */

size.addEventListener(
  "input",
  () => {

    sizeValue.textContent =
      size.value + "px";

    draw();

  }
);


/* 自動更新 */

text.addEventListener(
  "input",
  draw
);

font.addEventListener(
  "change",
  draw
);

color.addEventListener(
  "input",
  draw
);

transparent.addEventListener(
  "change",
  draw
);


/* 最初の画像 */

document.fonts.ready.then(
  draw
);

</script>

</body>
</html>
