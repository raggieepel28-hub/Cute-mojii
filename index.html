<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cute-moji ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff6fa;
  color: #6d5963;
  font-family:
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    "YuGothic",
    "Meiryo",
    sans-serif;
}

.wrapper {
  width: min(92%, 620px);
  margin: auto;
  padding: 28px 0 50px;
}

header {
  text-align: center;
  margin-bottom: 22px;
}

header .sub {
  color: #d29ab0;
  font-size: 11px;
  letter-spacing: 3px;
}

header h1 {
  margin: 6px 0;
  color: #c77e9b;
  font-size: 30px;
}

header p {
  margin: 0;
  color: #ad8c9a;
  font-size: 12px;
}

.card {
  background: #ffffff;
  border: 1px solid #f0dce5;
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 7px 22px rgba(190,130,160,.08);
}

.label {
  display: block;
  margin-bottom: 9px;
  color: #b87692;
  font-size: 13px;
  font-weight: bold;
}

textarea {
  width: 100%;
  min-height: 100px;
  padding: 14px;
  border: 1px solid #eed8e2;
  border-radius: 16px;
  resize: vertical;
  outline: none;
  background: #fffafd;
  color: #6d5963;
  font-size: 16px;
  font-family: inherit;
}

textarea:focus {
  border-color: #d69db6;
}

.controls {
  display: grid;
  gap: 15px;
  margin-top: 17px;
}

.control-title {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  color: #ad7a91;
  font-weight: bold;
}

select,
input[type="color"],
input[type="range"] {
  width: 100%;
}

select {
  padding: 11px;
  border: 1px solid #eed8e2;
  border-radius: 12px;
  background: #fffafd;
  color: #6d5963;
}

.color-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="color"] {
  width: 52px;
  height: 38px;
  padding: 2px;
  border: 1px solid #ead1dd;
  border-radius: 10px;
  background: white;
}

.range-value {
  font-size: 12px;
  color: #b47791;
  min-width: 35px;
  text-align: right;
}

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #806b74;
}

.check input {
  accent-color: #d69db6;
}

.preview-wrap {
  text-align: center;
}

canvas {
  max-width: 100%;
  height: auto;
  border-radius: 16px;
  background-image:
    linear-gradient(45deg, #f4e9ee 25%, transparent 25%),
    linear-gradient(-45deg, #f4e9ee 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #f4e9ee 75%),
    linear-gradient(-45deg, transparent 75%, #f4e9ee 75%);
  background-size: 24px 24px;
  background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  border: 1px solid #f0dce5;
}

.make-btn,
.save-btn {
  width: 100%;
  border: none;
  border-radius: 999px;
  padding: 14px;
  margin-top: 15px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

.make-btn {
  background: #d99db7;
  color: white;
}

.save-btn {
  background: #f2d4e0;
  color: #9e657d;
}

.note {
  text-align: center;
  color: #b99ca8;
  font-size: 10px;
  line-height: 1.7;
  margin-top: 12px;
}

footer {
  text-align: center;
  color: #c8a7b5;
  font-size: 10px;
  letter-spacing: 1px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="wrapper">

<header>
  <div class="sub">♡ CUTE TEXT MATERIAL MAKER ♡</div>
  <h1>Cute-moji</h1>
  <p>文字をかわいい画像素材にしよう 🎀</p>
</header>

<section class="card">

  <label class="label">♡ 文字を入力</label>

  <textarea
    id="textInput"
    placeholder="例：お誕生日おめでとう♡"
  ></textarea>

  <div class="controls">

    <div>
      <span class="control-title">♡ フォント</span>

      <select id="fontSelect">

        <option value="rounded">
          ふわふわ丸文字
        </option>

        <option value="serif">
          お姉さん系
        </option>

        <option value="hand">
          手書き風
        </option>

        <option value="bold">
          ぷっくり太文字
        </option>

      </select>
    </div>

    <div>

      <span class="control-title">
        ♡ 文字サイズ
      </span>

      <div class="color-row">

        <input
          id="sizeRange"
          type="range"
          min="30"
          max="130"
          value="65"
        >

        <span
          id="sizeValue"
          class="range-value"
        >
          65px
        </span>

      </div>

    </div>

    <div>

      <span class="control-title">
        ♡ 文字色
      </span>

      <div class="color-row">

        <input
          id="colorPicker"
          type="color"
          value="#d58ca8"
        >

        <span>
          好きな色に変更できるよ ♡
        </span>

      </div>

    </div>

    <label class="check">

      <input
        id="transparentCheck"
        type="checkbox"
        checked
      >

      背景を透明にする ♡

    </label>

  </div>

  <button
    class="make-btn"
    onclick="makeImage()"
  >
    ♡ 画像を作る ♡
  </button>

</section>


<section class="card">

  <label class="label">
    ♡ プレビュー
  </label>

  <div class="preview-wrap">

    <canvas
      id="canvas"
      width="1000"
      height="500"
    ></canvas>

  </div>

  <button
    class="save-btn"
    onclick="saveImage()"
  >
    ♡ PNG画像として保存する ♡
  </button>

  <div class="note">
    背景を透明にすると、文字だけの素材として<br>
    写真の上に重ねて使えるよ 🎀
  </div>

</section>

<footer>
  made with ♡ Cute-moji
</footer>

</div>


<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const textInput =
  document.getElementById("textInput");

const fontSelect =
  document.getElementById("fontSelect");

const sizeRange =
  document.getElementById("sizeRange");

const sizeValue =
  document.getElementById("sizeValue");

const colorPicker =
  document.getElementById("colorPicker");

const transparentCheck =
  document.getElementById("transparentCheck");


sizeRange.addEventListener("input", () => {

  sizeValue.textContent =
    sizeRange.value + "px";

  makeImage();

});


textInput.addEventListener("input", makeImage);
fontSelect.addEventListener("change", makeImage);
colorPicker.addEventListener("input", makeImage);
transparentCheck.addEventListener("change", makeImage);


function getFont() {

  const size = sizeRange.value;

  switch (fontSelect.value) {

    case "serif":
      return `${size}px "Yu Mincho", "Hiragino Mincho ProN", serif`;

    case "hand":
      return `${size}px "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif`;

    case "bold":
      return `bold ${size}px "Yu Gothic", "Meiryo", sans-serif`;

    default:
      return `${size}px "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif`;

  }

}


function makeImage() {

  const text =
    textInput.value || "ここに文字が入るよ ♡";

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (!transparentCheck.checked) {

    ctx.fillStyle = "#fff7fb";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  const font =
    getFont();

  ctx.font = font;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const maxWidth = 900;

  const lines =
    splitText(text, maxWidth);

  const lineHeight =
    Number(sizeRange.value) * 1.35;

  const totalHeight =
    lines.length * lineHeight;

  const startY =
    canvas.height / 2 -
    totalHeight / 2 +
    lineHeight / 2;


  lines.forEach((line, index) => {

    const y =
      startY + index * lineHeight;

    /*
      ふんわりした白い縁取り
      写真の上に載せても見やすくする
    */

    ctx.lineWidth = 12;

    ctx.strokeStyle =
      "rgba(255,255,255,0.95)";

    ctx.strokeText(
      line,
      canvas.width / 2,
      y
    );


    ctx.fillStyle =
      colorPicker.value;

    ctx.fillText(
      line,
      canvas.width / 2,
      y
    );

  });

}


function splitText(text, maxWidth) {

  const result = [];

  let current = "";

  for (const char of text) {

    const test =
      current + char;

    if (
      ctx.measureText(test).width >
        maxWidth &&
      current !== ""
    ) {

      result.push(current);

      current = char;

    } else {

      current = test;

    }

  }

  if (current) {
    result.push(current);
  }

  return result;

}


function saveImage() {

  const link =
    document.createElement("a");

  link.download =
    "Cute-moji.png";

  link.href =
    canvas.toDataURL("image/png");

  link.click();

}


makeImage();

</script>

</body>
</html>
