<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute-moji ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fff7fb;
  color: #6f5965;
  font-family:
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    "YuGothic",
    "Meiryo",
    sans-serif;
}

.container {
  width: min(92%, 600px);
  margin: 0 auto;
  padding: 35px 0 50px;
}

.header {
  text-align: center;
  margin-bottom: 28px;
}

.header .small {
  font-size: 12px;
  letter-spacing: 3px;
  color: #c99caf;
}

.header h1 {
  margin: 8px 0 5px;
  font-size: 32px;
  color: #c77f9b;
  letter-spacing: 2px;
}

.header p {
  margin: 0;
  font-size: 13px;
  color: #ad8d9c;
}

.card {
  background: rgba(255,255,255,0.92);
  border: 1px solid #f1dce6;
  border-radius: 24px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px rgba(190,130,160,0.08);
}

.label {
  display: block;
  font-size: 14px;
  color: #b87592;
  margin-bottom: 10px;
  font-weight: bold;
}

textarea {
  width: 100%;
  min-height: 130px;
  resize: vertical;
  border: 1px solid #efd7e2;
  border-radius: 17px;
  padding: 15px;
  outline: none;
  background: #fffafd;
  color: #6d5862;
  font-size: 16px;
  line-height: 1.8;
  font-family: inherit;
}

textarea:focus {
  border-color: #d9a2b8;
  box-shadow: 0 0 0 3px rgba(217,162,184,0.12);
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

button {
  border: none;
  cursor: pointer;
  font-family: inherit;
}

.main-btn {
  flex: 1;
  padding: 13px;
  border-radius: 999px;
  background: #d99bb5;
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.main-btn:active {
  transform: scale(0.98);
}

.sub-btn {
  padding: 13px 18px;
  border-radius: 999px;
  background: #f9e8ef;
  color: #b87592;
  font-size: 13px;
}

.result {
  white-space: pre-wrap;
  min-height: 120px;
  padding: 18px;
  border-radius: 17px;
  background: #fff8fc;
  border: 1px dashed #e5bdcf;
  font-size: 18px;
  line-height: 2;
  color: #725b67;
}

.copy-btn {
  width: 100%;
  margin-top: 13px;
  padding: 13px;
  border-radius: 999px;
  background: #f3d4e1;
  color: #9f6680;
  font-weight: bold;
}

.copy-message {
  text-align: center;
  font-size: 12px;
  color: #c4849f;
  margin-top: 9px;
  min-height: 18px;
}

.example {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.example button {
  padding: 9px 13px;
  border-radius: 999px;
  background: #fff0f6;
  color: #b87892;
  border: 1px solid #f2dbe5;
  font-size: 12px;
}

.footer {
  text-align: center;
  margin-top: 28px;
  font-size: 11px;
  color: #c9a9b7;
  letter-spacing: 1px;
}

@media (max-width: 480px) {
  .container {
    padding-top: 25px;
  }

  .header h1 {
    font-size: 28px;
  }

  .card {
    padding: 18px;
  }

  .buttons {
    flex-direction: column;
  }

  .sub-btn {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="small">♡ CUTE TEXT MAKER ♡</div>
    <h1>Cute-moji</h1>
    <p>文字をかわいくデコしちゃおう 🎀</p>
  </header>

  <section class="card">
    <label class="label">♡ すきな文章を入力してね</label>

    <textarea id="inputText"
      placeholder="例：今日は推し活してきた♡"></textarea>

    <div class="buttons">
      <button class="main-btn" onclick="makeCute()">
        ♡ かわいくする
      </button>

      <button class="sub-btn" onclick="clearText()">
        リセット
      </button>
    </div>
  </section>

  <section class="card">
    <label class="label">♡ できあがり</label>

    <div id="result" class="result">
ここにかわいい文字が表示されるよ ♡
    </div>

    <button class="copy-btn" onclick="copyText()">
      ♡ コピーする
    </button>

    <div id="copyMessage" class="copy-message"></div>
  </section>

  <section class="card">
    <label class="label">♡ おためし</label>

    <div class="example">
      <button onclick="setExample('今日は推し活♡')">
        推し活
      </button>

      <button onclick="setExample('お迎えできてうれしい🎀')">
        お迎え
      </button>

      <button onclick="setExample('かわいいものがすき♡')">
        かわいい
      </button>

      <button onclick="setExample('今日もがんばった！')">
        日常
      </button>
    </div>
  </section>

  <div class="footer">
    made with ♡ Cute-moji
  </div>

</div>

<script>

function makeCute() {

  const input = document.getElementById("inputText");
  const result = document.getElementById("result");

  let text = input.value.trim();

  if (!text) {
    result.textContent = "文章を入力してね ♡";
    return;
  }

  const decorations = [
    "♡ ",
    "🎀 ",
    "୨୧ ",
    "♡ "
  ];

  const randomDecoration =
    decorations[Math.floor(Math.random() * decorations.length)];

  result.textContent =
    randomDecoration + text + " ♡";
}


function copyText() {

  const result =
    document.getElementById("result").textContent;

  if (
    result === "ここにかわいい文字が表示されるよ ♡" ||
    result === "文章を入力してね ♡"
  ) {
    return;
  }

  navigator.clipboard.writeText(result).then(() => {

    const message =
      document.getElementById("copyMessage");

    message.textContent =
      "コピーしたよ ♡";

    setTimeout(() => {
      message.textContent = "";
    }, 1800);

  }).catch(() => {

    const message =
      document.getElementById("copyMessage");

    message.textContent =
      "コピーできなかったので長押ししてコピーしてね ♡";

  });
}


function clearText() {

  document.getElementById("inputText").value = "";

  document.getElementById("result").textContent =
    "ここにかわいい文字が表示されるよ ♡";

  document.getElementById("copyMessage").textContent = "";
}


function setExample(text) {

  document.getElementById("inputText").value = text;

  makeCute();
}

</script>

</body>
</html>
