<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cute-moji ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@400;600&family=Mochiy+Pop+One&family=New+Tegomin&family=Playpen+Sans+JP:wght@400;600&family=Rampart+One&family=Stick&family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff7fb;
  color: #6d5863;
  font-family: "Zen Maru Gothic", sans-serif;
}

.wrapper {
  width: min(94%, 650px);
  margin: auto;
  padding: 25px 0 50px;
}

/* --------------------
   HEADER
-------------------- */

header {
  text-align: center;
  margin-bottom: 22px;
}

.logo-small {
  color: #d39ab2;
  font-size: 11px;
  letter-spacing: 3px;
}

h1 {
  margin: 6px 0;
  color: #c8799a;
  font-family: "Mochiy Pop One", sans-serif;
  font-size: 30px;
}

header p {
  margin: 0;
  color: #ae8c9a;
  font-size: 12px;
}

/* --------------------
   CARD
-------------------- */

.card {
  background: rgba(255,255,255,.96);
  border: 1px solid #f0dce6;
  border-radius: 25px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 25px rgba(190,130,160,.08);
}

.label {
  display: block;
  margin-bottom: 10px;
  color: #b87591;
  font-size: 13px;
  font-weight: bold;
}

/* --------------------
   INPUT
-------------------- */

textarea {
  width: 100%;
  min-height: 105px;
  padding: 14px;
  resize: vertical;
  border: 1px solid #efd8e3;
  border-radius: 17px;
  outline: none;
  background: #fffafd;
  color: #6d5863;
  font-family: "Zen Maru Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.7;
}

textarea:focus {
  border-color: #d89db5;
}

/* --------------------
   CONTROLS
-------------------- */

.control {
  margin-top: 17px;
}

.control-title {
  display: block;
  margin-bottom: 8px;
  color: #ad718d;
  font-size: 12px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 11px;
  border: 1px solid #eed8e2;
  border-radius: 13px;
  background: #fffafd;
  color: #6d5863;
  font-family: inherit;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="range"] {
  flex: 1;
  accent-color: #d69ab4;
}

.value {
  width: 45px;
  text-align: right;
  font-size: 12px;
  color: #b27690;
}

input[type="color"] {
  width: 52px;
  height: 38px;
  padding: 2px;
  border: 1px solid #ead2dd;
  border-radius: 10px;
  background: white;
}

.color-label {
  font-size: 12px;
  color: #806b74;
}

/* --------------------
   CHECKBOX
-------------------- */

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 17px;
  font-size: 13px;
}

.check input {
  accent-color: #d596b0;
}

/* --------------------
   PREVIEW
-------------------- */

.preview {
  width: 100%;
  overflow: hidden;
  text-align: center;
}

canvas {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  border-radius: 17px;

  background-image:
    linear-gradient(45deg,#f1e6eb 25%,transparent 25%),
    linear-gradient(-45deg,#f1e6eb 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#f1e6eb 75%),
    linear-gradient(-45deg,transparent 75%,#f1e6eb 75%);

  background-size: 24px 24px;

  background-position:
    0 0,
    0 12px,
    12px -12px,
    -12px 0;

  border: 1px solid #efdce5;
}

/* --------------------
   BUTTONS
-------------------- */

button {
  width: 100%;
  border: 0;
  border-radius: 999px;
  padding: 14px;
  margin-top: 17px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

.make {
  background: #d89bb5;
  color: white;
}

.save {
  background: #f2d3df;
  color: #9d647d;
}

.message {
  min-height: 18px;
  margin-top: 9px;
  text-align: center;
  color: #c27d98;
  font-size: 11px;
}

/* --------------------
   FONT PREVIEW
-------------------- */

.font-preview {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #fff6fa;
  color: #c27e99;
  text-align: center;
  font-size: 20px;
}

/* --------------------
   FOOTER
-------------------- */

footer {
  text-align: center;
  color: #c8a7b5;
  font-size: 10px;
  letter-spacing: 1px;
}

</style>
</head>


<body>

<div class="wrapper">

<header>

  <div class="logo-small">
    ♡ CUTE TEXT MATERIAL MAKER ♡
  </div>

  <h1>Cute-moji</h1>

  <p>
    かわいい文字素材を作ろう 🎀
  </p>

</header>


<!-- ====================
     TEXT
==================== -->

<section class="card">

<label class="label">
♡ 文字を入力
</label>

<textarea
id="text"
placeholder="例：お誕生日おめでとう♡"
></textarea>


<!-- ====================
     FONT
==================== -->

<div class="control">

<span class="control-title">
♡ フォント
</span>

<select id="font">

<option value="Mochiy Pop One">
🎀 ぷっくり量産型
</option>

<option value="Yomogi">
🌷 ゆるふわ手書き
</option>

<option value="Klee One">
♡ おしゃれ手書き
</option>

<option value="Playpen Sans JP">
🩷 かわいい手書き
</option>

<option value="Zen Maru Gothic">
🫧 ふわふわ丸文字
</option>

<option value="Rampart One">
✨ ぷっくりポップ
</option>

<option value="Stick">
🍓 ころころポップ
</option>

<option value="DotGothic16">
🎮 ちょいレトロ
</option>

</select>


<div
id="fontPreview"
class="font-preview"
>
かわいい文字 ♡
</div>

</div>


<!-- ====================
     SIZE
==================== -->

<div class="control">

<span class="control-title">
♡ 文字サイズ
</span>

<div class="row">

<input
id="size"
type="range"
min="35"
max="130"
value="65"
>

<span
id="sizeValue"
class="value"
>
65px
</span>

</div>

</div>


<!-- ====================
     TEXT COLOR
==================== -->

<div class="control">

<span class="control-title">
♡ 文字色
</span>

<div class="row">

<input
id="color"
type="color"
value="#d58ba8"
>

<span class="color-label">
好きな色にできるよ ♡
</span>

</div>

</div>


<!-- ====================
     OUTLINE
==================== -->

<div class="control">

<span class="control-title">
♡ 白ふちの太さ
</span>

<div class="row">

<input
id="outline"
type="range"
min="0"
max="30"
value="12"
>

<span
id="outlineValue"
class="value"
>
12px
</span>

</div>

</div>


<!-- ====================
     GLOW
==================== -->

<div class="control">

<span class="control-title">
♡ 光らせ方
</span>

<select id="glow">

<option value="none">
✦ 光らせない
</option>

<option value="soft">
♡ ふんわり光る
</option>

<option value="strong">
✨ 強めに光る
</option>

<option value="dream">
🫧 ふわっと発光
</option>

</select>

</div>


<!-- ====================
     GLOW COLOR
==================== -->

<div class="control">

<span class="control-title">
♡ 光の色
</span>

<div class="row">

<input
id="glowColor"
type="color"
value="#ffffff"
>

<span class="color-label">
光の色も変更できるよ ✨
</span>

</div>

</div>


<!-- ====================
     GLOW POWER
==================== -->

<div class="control">

<span class="control-title">
♡ 光の強さ
</span>

<div class="row">

<input
id="glowPower"
type="range"
min="0"
max="40"
value="18"
>

<span
id="glowPowerValue"
class="value"
>
18
</span>

</div>

</div>


<!-- ====================
     TRANSPARENT
==================== -->

<label class="check">

<input
id="transparent"
type="checkbox"
checked
>

背景を透明にする ♡

</label>


<button
class="make"
onclick="draw()"
>
♡ 画像を作る ♡
</button>

</section>


<!-- ====================
     PREVIEW
==================== -->

<section class="card">

<label class="label">
♡ プレビュー
</label>

<div class="preview">

<canvas
id="canvas"
width="1200"
height="600"
></canvas>

</div>


<button
class="save"
onclick="saveImage()"
>
♡ PNG画像として保存する ♡
</button>


<div
id="message"
class="message"
></div>

</section>


<footer>
made with ♡ Cute-moji
</footer>

</div>


<script>

/* ====================
   ELEMENTS
==================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const text =
document.getElementById("text");

const font =
document.getElementById("font");

const size =
document.getElementById("size");

const sizeValue =
document.getElementById("sizeValue");

const color =
document.getElementById("color");

const outline =
document.getElementById("outline");

const outlineValue =
document.getElementById("outlineValue");

const glow =
document.getElementById("glow");

const glowColor =
document.getElementById("glowColor");

const glowPower =
document.getElementById("glowPower");

const glowPowerValue =
document.getElementById("glowPowerValue");

const transparent =
document.getElementById("transparent");

const fontPreview =
document.getElementById("fontPreview");

const message =
document.getElementById("message");


/* ====================
   FONT PREVIEW
==================== */

function updateFontPreview() {

fontPreview.style.fontFamily =
`"${font.value}"`;

fontPreview.textContent =
"かわいい文字 ♡";

}


/* ====================
   LINE BREAK
==================== */

function makeLines(
textValue,
maxWidth
) {

const lines = [];

let current = "";

for (const char of textValue) {

const test =
current + char;

if (
ctx.measureText(test).width >
maxWidth &&
current !== ""
) {

lines.push(current);

current = char;

} else {

current = test;

}

}

if (current) {
lines.push(current);
}

return lines;

}


/* ====================
   DRAW
==================== */

async function draw() {

await document.fonts.ready;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/* BACKGROUND */

if (!transparent.checked) {

ctx.fillStyle =
"#fff7fb";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

}


/* FONT */

const fontSize =
Number(size.value);

const fontName =
font.value;

ctx.font =
`${fontSize}px "${fontName}"`;

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";


/* TEXT */

const input =
text.value.trim() ||
"ここに文字が入るよ ♡";


const lines =
makeLines(
input,
1050
);


const lineHeight =
fontSize * 1.45;

const totalHeight =
lines.length * lineHeight;

const startY =
canvas.height / 2 -
totalHeight / 2 +
lineHeight / 2;


/* GLOW */

let shadowBlur = 0;

if (glow.value === "soft") {

shadowBlur =
Number(glowPower.value) * 0.7;

}

if (glow.value === "strong") {

shadowBlur =
Number(glowPower.value) * 1.5;

}

if (glow.value === "dream") {

shadowBlur =
Number(glowPower.value);

}


/* DRAW EACH LINE */

lines.forEach(
(line,index) => {

const y =
startY +
index * lineHeight;


/* GLOW */

if (glow.value !== "none") {

ctx.save();

ctx.shadowColor =
glowColor.value;

ctx.shadowBlur =
shadowBlur;

ctx.fillStyle =
glowColor.value;

ctx.fillText(
line,
canvas.width / 2,
y
);

ctx.restore();

}


/* WHITE OUTLINE */

const outlineSize =
Number(outline.value);

if (outlineSize > 0) {

ctx.lineWidth =
outlineSize;

ctx.strokeStyle =
"rgba(255,255,255,.96)";

ctx.strokeText(
line,
canvas.width / 2,
y
);

}


/* MAIN TEXT */

ctx.fillStyle =
color.value;

ctx.fillText(
line,
canvas.width / 2,
y
);

});

}


/* ====================
   SAVE
==================== */

function saveImage() {

const link =
document.createElement("a");

link.download =
"Cute-moji.png";

link.href =
canvas.toDataURL(
"image/png"
);

link.click();


message.textContent =
"PNG画像を保存したよ ♡";

setTimeout(
() => {

message.textContent = "";

},
2000
);

}


/* ====================
   EVENTS
==================== */

size.addEventListener(
"input",
() => {

sizeValue.textContent =
size.value + "px";

draw();

});


outline.addEventListener(
"input",
() => {

outlineValue.textContent =
outline.value + "px";

draw();

});


glowPower.addEventListener(
"input",
() => {

glowPowerValue.textContent =
glowPower.value;

draw();

});


text.addEventListener(
"input",
draw
);

font.addEventListener(
"change",
() => {

updateFontPreview();

draw();

});

color.addEventListener(
"input",
draw
);

glow.addEventListener(
"change",
draw
);

glowColor.addEventListener(
"input",
draw
);

transparent.addEventListener(
"change",
draw
);


/* ====================
   START
==================== */

document.fonts.ready.then(
() => {

updateFontPreview();

draw();

});

</script>

</body>
</html>
