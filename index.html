<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cute-moji ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Mochiy+Pop+One&family=Playpen+Sans+JP:wght@400;600&family=Rampart+One&family=Stick&family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff7fb;
  color: #6d5863;
  font-family: "Zen Maru Gothic", sans-serif;
}

.wrapper {
  width: min(94%, 680px);
  margin: auto;
  padding: 25px 0 50px;
}

/* HEADER */

header {
  text-align: center;
  margin-bottom: 22px;
}

.logo-small {
  color: #d39ab2;
  font-size: 10px;
  letter-spacing: 3px;
}

h1 {
  margin: 6px 0;
  color: #c8799a;
  font-family: "Mochiy Pop One", sans-serif;
  font-size: 30px;
}

header p {
  margin: 0;
  color: #ae8c9a;
  font-size: 12px;
}

/* CARD */

.card {
  background: rgba(255,255,255,.97);
  border: 1px solid #f0dce6;
  border-radius: 25px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 25px rgba(190,130,160,.08);
}

.label {
  display: block;
  margin-bottom: 10px;
  color: #b87591;
  font-size: 13px;
  font-weight: bold;
}

/* TEXT */

textarea {
  width: 100%;
  min-height: 115px;
  padding: 14px;
  resize: vertical;
  border: 1px solid #efd8e3;
  border-radius: 17px;
  outline: none;
  background: #fffafd;
  color: #6d5863;
  font-family: "Zen Maru Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.7;
}

textarea:focus {
  border-color: #d89db5;
}

/* CONTROLS */

.control {
  margin-top: 17px;
}

.control-title {
  display: block;
  margin-bottom: 8px;
  color: #ad718d;
  font-size: 12px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 11px;
  border: 1px solid #eed8e2;
  border-radius: 13px;
  background: #fffafd;
  color: #6d5863;
  font-family: inherit;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="range"] {
  flex: 1;
  accent-color: #d69ab4;
}

.value {
  width: 48px;
  text-align: right;
  font-size: 12px;
  color: #b27690;
}

input[type="color"] {
  width: 52px;
  height: 38px;
  padding: 2px;
  border: 1px solid #ead2dd;
  border-radius: 10px;
  background: white;
}

.color-label {
  font-size: 12px;
  color: #806b74;
}

/* CHECKBOX */

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
  font-size: 13px;
}

.check input {
  accent-color: #d596b0;
}

/* DECORATION BUTTONS */

.decorations {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.decor {
  border: 1px solid #efdce5;
  background: #fff8fb;
  color: #ad718d;
  border-radius: 13px;
  padding: 10px 5px;
  margin: 0;
  font-size: 12px;
}

.decor.active {
  background: #f4dce7;
  border-color: #d89db5;
}

/* FONT PREVIEW */

.font-preview {
  margin-top: 8px;
  padding: 10px;
  border-radius: 12px;
  background: #fff6fa;
  color: #c27e99;
  text-align: center;
  font-size: 21px;
}

/* PREVIEW */

.preview-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.preview-note {
  color: #c29aaa;
  font-size: 10px;
}

.preview {
  width: 100%;
  overflow: hidden;
  position: relative;
  border-radius: 17px;
  background-image:
    linear-gradient(45deg,#e9dfe4 25%,transparent 25%),
    linear-gradient(-45deg,#e9dfe4 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#e9dfe4 75%),
    linear-gradient(-45deg,transparent 75%,#e9dfe4 75%);

  background-size: 24px 24px;

  background-position:
    0 0,
    0 12px,
    12px -12px,
    -12px 0;
}

.preview.has-photo {
  background: #ddd;
}

#photo {
  display: none;
}

.photo-button {
  display: block;
  width: 100%;
  text-align: center;
  border: 1px solid #efdce5;
  border-radius: 999px;
  padding: 11px;
  margin-top: 12px;
  color: #ad718d;
  background: #fff8fb;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

#photoPreview {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

canvas {
  display: block;
  position: relative;
  z-index: 2;
  width: 100%;
  height: auto;
}

/* BUTTON */

button {
  width: 100%;
  border: 0;
  border-radius: 999px;
  padding: 14px;
  margin-top: 17px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

.make {
  background: #d89bb5;
  color: white;
}

.save {
  background: #f2d3df;
  color: #9d647d;
}

.remove-photo {
  background: #fff0f5;
  color: #b97891;
  font-size: 11px;
  padding: 10px;
  margin-top: 8px;
}

/* MESSAGE */

.message {
  min-height: 18px;
  margin-top: 9px;
  text-align: center;
  color: #c27d98;
  font-size: 11px;
}

/* FOOTER */

footer {
  text-align: center;
  color: #c8a7b5;
  font-size: 10px;
  letter-spacing: 1px;
}

</style>
</head>


<body>

<div class="wrapper">

<header>

  <div class="logo-small">
    ♡ CUTE TEXT MATERIAL MAKER ♡
  </div>

  <h1>Cute-moji</h1>

  <p>
    写真に貼れる♡かわいい文字素材を作ろう
  </p>

</header>


<!-- =========================
     TEXT
========================= -->

<section class="card">

<label class="label">
♡ 文字を入力
</label>

<textarea
id="text"
placeholder="例：今日はがんばったから&#10;ごほうびごはんにしちゃおっ♡"
></textarea>


<!-- FONT -->

<div class="control">

<span class="control-title">
♡ 文字の雰囲気
</span>

<select id="font">

<option value="Yomogi">
✍🏻 ゆるふわ手書き
</option>

<option value="Klee One">
♡ 細めのおしゃれ手書き
</option>

<option value="Playpen Sans JP">
🌷 かわいい手書き
</option>

<option value="Zen Maru Gothic">
🫧 ふわふわ丸文字
</option>

<option value="Mochiy Pop One">
🎀 ぷっくり量産型
</option>

<option value="Rampart One">
✨ ぷっくりポップ
</option>

<option value="Stick">
🍓 ころころポップ
</option>

</select>

<div
id="fontPreview"
class="font-preview"
>
かわいい文字 ♡
</div>

</div>


<!-- SIZE -->

<div class="control">

<span class="control-title">
♡ 文字サイズ
</span>

<div class="row">

<input
id="size"
type="range"
min="30"
max="120"

>

<span id="sizeValue" class="value">
62px
</span>

</div>

</div>


<!-- COLOR -->

<div class="control">

<span class="control-title">
♡ ペンの色
</span>

<div class="row">

<input
id="color"
type="color"
value="#ffffff"
>

<span class="color-label">
白ペン風ならこのままでOK ♡
</span>

</div>

</div>


<!-- OUTLINE -->

<div class="control">

<span class="control-title">
♡ ふちの太さ
</span>

<div class="row">

<input
id="outline"
type="range"
min="0"
max="30"
value="0"
>

<span id="outlineValue" class="value">
0px
</span>

</div>

</div>


<!-- GLOW -->

<div class="control">

<span class="control-title">
♡ ネオン
</span>

<select id="glow">

<option value="none">
✦ ネオンなし
</option>

<option value="soft">
♡ ふんわりネオン
</option>

<option value="normal" selected>
💗 ネオン
</option>

<option value="strong">
✨ 強めネオン
</option>

</select>

</div>


<!-- GLOW COLOR -->

<div class="control">

<span class="control-title">
♡ ネオンの色
</span>

<div class="row">

<input
id="glowColor"
type="color"

>

<span class="color-label">
光の色 ✨
</span>

</div>


<!-- GLOW POWER -->

<div class="control">

<span class="control-title">
♡ ネオンの強さ
</span>

<div class="row">

<input
id="glowPower"
type="range"
min="5"
max="50"
value="25"
>

<span id="glowPowerValue" class="value">
25
</span>

</div>

</div>


<!-- DECORATIONS -->

<div class="control">

<span class="control-title">
♡ 手書きデコを追加
</span>

<div class="decorations">

<button
class="decor"
data-decor="heart"
>
♡ ハート
</button>

<button
class="decor"
data-decor="sparkle"
>
✧ キラキラ
</button>

<button
class="decor"
data-decor="arrow"
>
↪︎ 矢印
</button>

<button
class="decor"
data-decor="dots"
>
・・・・
</button>

<button
class="decor"
data-decor="music"
>
♪ 音符
</button>

<button
class="decor"
data-decor="frame"
>
☁ 囲み
</button>

</div>

</div>


<!-- TRANSPARENT -->

<label class="check">

<input
id="transparent"
type="checkbox"
checked
>

背景を透明にする ♡

</label>


<button
class="make"
id="makeButton"
>
♡ 画像を作る ♡
</button>

</section>


<!-- =========================
     PHOTO PREVIEW
========================= -->

<section class="card">

<label class="label">
♡ 写真に重ねて確認
</label>

<label
for="photo"
class="photo-button"
>
📷 写真を入れてみる
</label>

<input
id="photo"
type="file"
accept="image/*"
>

<button
class="remove-photo"
id="removePhoto"
style="display:none;"
>
写真を外す
</button>

</section>


<!-- =========================
     PREVIEW
========================= -->

<section class="card">

<div class="preview-title">

<label class="label">
♡ プレビュー
</label>

<span class="preview-note">
チェック柄部分＝透明
</span>

</div>

<div
id="preview"
class="preview"
>

<img
id="photoPreview"
>

<canvas
id="canvas"
width="1200"
height="700"
></canvas>

</div>


<button
class="save"
id="saveButton"
>
♡ 透明PNGとして保存 ♡
</button>

<div
id="message"
class="message"
></div>

</section>


<footer>
made with ♡ Cute-moji
</footer>

</div>


<script>

/* ===================================
   ELEMENTS
=================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const text =
document.getElementById("text");

const font =
document.getElementById("font");

const size =
document.getElementById("size");

const sizeValue =
document.getElementById("sizeValue");

const color =
document.getElementById("color");

const outline =
document.getElementById("outline");

const outlineValue =
document.getElementById("outlineValue");

const glow =
document.getElementById("glow");

const glowColor =
document.getElementById("glowColor");

const glowPower =
document.getElementById("glowPower");

const glowPowerValue =
document.getElementById("glowPowerValue");

const transparent =
document.getElementById("transparent");

const fontPreview =
document.getElementById("fontPreview");

const preview =
document.getElementById("preview");

const photo =
document.getElementById("photo");

const photoPreview =
document.getElementById("photoPreview");

const removePhoto =
document.getElementById("removePhoto");

const message =
document.getElementById("message");


/* ===================================
   DECORATIONS
=================================== */

let selectedDecorations = [];


document.querySelectorAll(".decor").forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const type =
          button.dataset.decor;

        button.classList.toggle("active");

        if (
          selectedDecorations.includes(type)
        ) {

          selectedDecorations =
            selectedDecorations.filter(
              item => item !== type
            );

        } else {

          selectedDecorations.push(type);

        }

        draw();

      }
    );

  }
);


/* ===================================
   FONT PREVIEW
=================================== */

function updateFontPreview() {

  fontPreview.style.fontFamily =
    `"${font.value}"`;

}


/* ===================================
   TEXT LINES
=================================== */

function makeLines(
  value,
  maxWidth
) {

  const lines = [];

  const manualLines =
    value.split("\n");

  manualLines.forEach(
    manualLine => {

      if (manualLine === "") {

        lines.push("");

        return;

      }

      let current = "";

      for (
        const char of manualLine
      ) {

        const test =
          current + char;

        if (
          ctx.measureText(test).width >
          maxWidth &&
          current !== ""
        ) {

          lines.push(current);

          current = char;

        } else {

          current = test;

        }

      }

      if (current) {
        lines.push(current);
      }

    }
  );

  return lines;

}


/* ===================================
   NEON
=================================== */

function drawNeon(
  line,
  x,
  y
) {

  if (
    glow.value === "none"
  ) {

    return;

  }


  const power =
    Number(glowPower.value);


  let outer =
    power * 2.5;

  let middle =
    power * 1.4;

  let inner =
    power * .6;


  if (
    glow.value === "soft"
  ) {

    outer =
      power * 1.8;

    middle =
      power;

    inner =
      power * .45;

  }


  if (
    glow.value === "strong"
  ) {

    outer =
      power * 3.2;

    middle =
      power * 1.8;

    inner =
      power * .8;

  }


  /* 外側 */

  ctx.save();

  ctx.shadowColor =
    glowColor.value;

  ctx.shadowBlur =
    outer;

  ctx.fillStyle =
    glowColor.value;

  ctx.globalAlpha =
    .28;

  ctx.fillText(
    line,
    x,
    y
  );

  ctx.restore();


  /* 中間 */

  ctx.save();

  ctx.shadowColor =
    glowColor.value;

  ctx.shadowBlur =
    middle;

  ctx.fillStyle =
    glowColor.value;

  ctx.globalAlpha =
    .55;

  ctx.fillText(
    line,
    x,
    y
  );

  ctx.restore();


  /* 内側 */

  ctx.save();

  ctx.shadowColor =
    glowColor.value;

  ctx.shadowBlur =
    inner;

  ctx.fillStyle =
    "#ffffff";

  ctx.globalAlpha =
    .9;

  ctx.fillText(
    line,
    x,
    y
  );

  ctx.restore();

}


/* ===================================
   HAND-DRAWN DECORATIONS
=================================== */

function drawDecorations() {

  ctx.save();

  ctx.strokeStyle =
    color.value;

  ctx.fillStyle =
    color.value;

  ctx.lineWidth = 5;

  ctx.lineCap = "round";

  ctx.lineJoin = "round";


  /* ハート */

  if (
    selectedDecorations.includes("heart")
  ) {

    drawHeart(
      160,
      145,
      42
    );

    drawHeart(
      1040,
      545,
      30
    );

  }


  /* キラキラ */

  if (
    selectedDecorations.includes("sparkle")
  ) {

    drawSparkle(
      1020,
      160,
      32
    );

    drawSparkle(
      180,
      540,
      25
    );

  }


  /* 矢印 */

  if (
    selectedDecorations.includes("arrow")
  ) {

    ctx.beginPath();

    ctx.moveTo(
      930,
      220
    );

    ctx.quadraticCurveTo(
      820,
      250,
      780,
      320
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      780,
      320
    );

    ctx.lineTo(
      800,
      300
    );

    ctx.moveTo(
      780,
      320
    );

    ctx.lineTo(
      806,
      322
    );

    ctx.stroke();

  }


  /* 点線 */

  if (
    selectedDecorations.includes("dots")
  ) {

    ctx.setLineDash([
      7,
      13
    ]);

    ctx.beginPath();

    ctx.moveTo(
      170,
      610
    );

    ctx.quadraticCurveTo(
      600,
      650,
      1030,
      610
    );

    ctx.stroke();

    ctx.setLineDash([]);

  }


  /* 音符 */

  if (
    selectedDecorations.includes("music")
  ) {

    ctx.font =
      '45px "Yomogi"';

    ctx.fillText(
      "♪",
      100,
      230
    );

    ctx.fillText(
      "♫",
      1080,
      400
    );

  }


  /* 囲み */

  if (
    selectedDecorations.includes("frame")
  ) {

    ctx.lineWidth = 5;

    ctx.setLineDash([
      10,
      10
    ]);

    ctx.beginPath();

    ctx.roundRect(
      90,
      90,
      1020,
      520,
      55
    );

    ctx.stroke();

    ctx.setLineDash([]);

  }


  ctx.restore();

}


/* ===================================
   HEART
=================================== */

function drawHeart(
  x,
  y,
  size
) {

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    size / 50,
    size / 50
  );

  ctx.beginPath();

  ctx.moveTo(
    0,
    18
  );

  ctx.bezierCurveTo(
    -45,
    -10,
    -25,
    -40,
    0,
    -18
  );

  ctx.bezierCurveTo(
    25,
    -40,
    45,
    -10,
    0,
    18
  );

  ctx.stroke();

  ctx.restore();

}


/* ===================================
   SPARKLE
=================================== */

function drawSparkle(
  x,
  y,
  size
) {

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.beginPath();

  ctx.moveTo(
    0,
    -size
  );

  ctx.lineTo(
    0,
    size
  );

  ctx.moveTo(
    -size,
    0
  );

  ctx.lineTo(
    size,
    0
  );

  ctx.stroke();

  ctx.restore();

}


/* ===================================
   DRAW
=================================== */

async function draw() {

  await document.fonts.ready;


  /*
    完全クリア
    ↓
    透明になる
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* フォント */

  const fontSize =
    Number(size.value);

  ctx.font =
    `${fontSize}px "${font.value}"`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  const input =
    text.value.trim() ||
    "ここに文字が入るよ ♡";


  const lines =
    makeLines(
      input,
      960
    );


  const lineHeight =
    fontSize * 1.45;


  const totalHeight =
    lines.length *
    lineHeight;


  const startY =
    canvas.height / 2 -
    totalHeight / 2 +
    lineHeight / 2;


  /* 文字 */

  lines.forEach(
    (line,index) => {

      const x =
        canvas.width / 2;

      const y =
        startY +
        index * lineHeight;


      /*
        ネオン
      */

      drawNeon(
        line,
        x,
        y
      );


      /*
        ふち
      */

      const outlineSize =
        Number(outline.value);


      if (
        outlineSize > 0
      ) {

        ctx.save();

        ctx.lineWidth =
          outlineSize;

        ctx.strokeStyle =
          "rgba(255,255,255,.98)";

        ctx.strokeText(
          line,
          x,
          y
        );

        ctx.restore();

      }


      /*
        本体
      */

      ctx.save();

      ctx.fillStyle =
        color.value;

      ctx.fillText(
        line,
        x,
        y
      );

      ctx.restore();

    });


  /*
    飾り
  */

  drawDecorations();


  /*
    プレビュー
  */

  if (
    transparent.checked
  ) {

    preview.style.backgroundImage =
      `
      linear-gradient(45deg,#e9dfe4 25%,transparent 25%),
      linear-gradient(-45deg,#e9dfe4 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#e9dfe4 75%),
      linear-gradient(-45deg,transparent 75%,#e9dfe4 75%)
      `;

    preview.style.backgroundSize =
      "24px 24px";

    preview.style.backgroundPosition =
      "0 0,0 12px,12px -12px,-12px 0";

  } else {

    preview.style.backgroundImage =
      "none";

    preview.style.background =
      "#fff7fb";

  }

}


/* ===================================
   PHOTO
=================================== */

photo.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];

    if (!file) {
      return;
    }


    const url =
      URL.createObjectURL(file);


    photoPreview.src =
      url;

    photoPreview.style.display =
      "block";

    preview.classList.add(
      "has-photo"
    );

    removePhoto.style.display =
      "block";

  }
);


removePhoto.addEventListener(
  "click",
  function() {

    photo.value = "";

    photoPreview.src = "";

    photoPreview.style.display =
      "none";

    preview.classList.remove(
      "has-photo"
    );

    this.style.display =
      "none";

  }
);


/* ===================================
   SAVE PNG
=================================== */

function saveImage() {

  /*
    透明PNGの場合、
    Canvasには背景を描いていない。

    CSSのチェック柄も
    保存されない。
  */

  const link =
    document.createElement("a");


  if (
    transparent.checked
  ) {

    link.download =
      "Cute-moji-transparent.png";

  } else {

    link.download =
      "Cute-moji.png";

  }


  link.href =
    canvas.toDataURL(
      "image/png"
    );


  link.click();


  message.textContent =
    transparent.checked
      ? "背景透明のPNGを保存したよ ♡"
      : "PNG画像を保存したよ ♡";


  setTimeout(
    () => {

      message.textContent =
        "";

    },
    2500
  );

}


/* ===================================
   EVENTS
=================================== */

text.addEventListener(
  "input",
  draw
);


font.addEventListener(
  "change",
  () => {

    updateFontPreview();

    draw();

  }
);


color.addEventListener(
  "input",
  draw
);


glow.addEventListener(
  "change",
  draw
);


glowColor.addEventListener(
  "input",
  draw
);


transparent.addEventListener(
  "change",
  draw
);


size.addEventListener(
  "input",
  () => {

    sizeValue.textContent =
      size.value + "px";

    draw();

  }
);


outline.addEventListener(
  "input",
  () => {

    outlineValue.textContent =
      outline.value + "px";

    draw();

  }
);


glowPower.addEventListener(
  "input",
  () => {

    glowPowerValue.textContent =
      glowPower.value;

    draw();

  }
);


document.getElementById(
  "makeButton"
).addEventListener(
  "click",
  draw
);


document.getElementById(
  "saveButton"
).addEventListener(
  "click",
  saveImage
);


/* ===================================
   START
=================================== */

document.fonts.ready.then(
  () => {

    updateFontPreview();

    draw();

  }
);

</script>

</body>
</html>
