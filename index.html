<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cute-moji ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Mochiy+Pop+One&family=Playpen+Sans+JP:wght@400;600&family=Rampart+One&family=Stick&family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff7fb;
  color: #6d5863;
  font-family: "Zen Maru Gothic", sans-serif;
}

.wrapper {
  width: min(94%, 650px);
  margin: auto;
  padding: 25px 0 50px;
}

header {
  text-align: center;
  margin-bottom: 22px;
}

.logo-small {
  color: #d39ab2;
  font-size: 11px;
  letter-spacing: 3px;
}

h1 {
  margin: 6px 0;
  color: #c8799a;
  font-family: "Mochiy Pop One", sans-serif;
  font-size: 30px;
}

header p {
  margin: 0;
  color: #ae8c9a;
  font-size: 12px;
}

.card {
  background: rgba(255,255,255,.96);
  border: 1px solid #f0dce6;
  border-radius: 25px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 25px rgba(190,130,160,.08);
}

.label {
  display: block;
  margin-bottom: 10px;
  color: #b87591;
  font-size: 13px;
  font-weight: bold;
}

textarea {
  width: 100%;
  min-height: 105px;
  padding: 14px;
  resize: vertical;
  border: 1px solid #efd8e3;
  border-radius: 17px;
  outline: none;
  background: #fffafd;
  color: #6d5863;
  font-family: "Zen Maru Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.7;
}

textarea:focus {
  border-color: #d89db5;
}

.control {
  margin-top: 17px;
}

.control-title {
  display: block;
  margin-bottom: 8px;
  color: #ad718d;
  font-size: 12px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 11px;
  border: 1px solid #eed8e2;
  border-radius: 13px;
  background: #fffafd;
  color: #6d5863;
  font-family: inherit;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="range"] {
  flex: 1;
  accent-color: #d69ab4;
}

.value {
  width: 48px;
  text-align: right;
  font-size: 12px;
  color: #b27690;
}

input[type="color"] {
  width: 52px;
  height: 38px;
  padding: 2px;
  border: 1px solid #ead2dd;
  border-radius: 10px;
  background: white;
}

.color-label {
  font-size: 12px;
  color: #806b74;
}

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 17px;
  font-size: 13px;
}

.check input {
  accent-color: #d596b0;
}

.font-preview {
  margin-top: 8px;
  padding: 10px;
  border-radius: 12px;
  background: #fff6fa;
  color: #c27e99;
  text-align: center;
  font-size: 20px;
}

/* プレビュー */

.preview {
  width: 100%;
  overflow: hidden;
  text-align: center;
  border-radius: 17px;
}

/*
  これは「透明ですよ」と
  見せるためだけの背景。
  PNGには保存されません。
*/

.preview.transparent-view {
  background-image:
    linear-gradient(45deg, #eadfe4 25%, transparent 25%),
    linear-gradient(-45deg, #eadfe4 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #eadfe4 75%),
    linear-gradient(-45deg, transparent 75%, #eadfe4 75%);

  background-size: 24px 24px;

  background-position:
    0 0,
    0 12px,
    12px -12px,
    -12px 0;
}

.preview.white-view {
  background: #fff7fb;
}

canvas {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  border-radius: 17px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 999px;
  padding: 14px;
  margin-top: 17px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

.make {
  background: #d89bb5;
  color: white;
}

.save {
  background: #f2d3df;
  color: #9d647d;
}

.message {
  min-height: 18px;
  margin-top: 9px;
  text-align: center;
  color: #c27d98;
  font-size: 11px;
}

footer {
  text-align: center;
  color: #c8a7b5;
  font-size: 10px;
  letter-spacing: 1px;
}

</style>
</head>


<body>

<div class="wrapper">

<header>

  <div class="logo-small">
    ♡ CUTE TEXT MATERIAL MAKER ♡
  </div>

  <h1>Cute-moji</h1>

  <p>
    かわいい文字素材を作ろう 🎀
  </p>

</header>


<section class="card">

<label class="label">
♡ 文字を入力
</label>

<textarea
id="text"
placeholder="例：お誕生日おめでとう♡"
></textarea>


<div class="control">

<span class="control-title">
♡ フォント
</span>

<select id="font">

<option value="Mochiy Pop One">
🎀 ぷっくり量産型
</option>

<option value="Yomogi">
🌷 ゆるふわ手書き
</option>

<option value="Klee One">
♡ おしゃれ手書き
</option>

<option value="Playpen Sans JP">
🩷 かわいい手書き
</option>

<option value="Zen Maru Gothic">
🫧 ふわふわ丸文字
</option>

<option value="Rampart One">
✨ ぷっくりポップ
</option>

<option value="Stick">
🍓 ころころポップ
</option>

</select>


<div
id="fontPreview"
class="font-preview"
>
かわいい文字 ♡
</div>

</div>


<div class="control">

<span class="control-title">
♡ 文字サイズ
</span>

<div class="row">

<input
id="size"
type="range"
min="35"
max="130"
value="65"
>

<span
id="sizeValue"
class="value"
>
65px
</span>

</div>

</div>


<div class="control">

<span class="control-title">
♡ 文字色
</span>

<div class="row">

<input
id="color"
type="color"
value="#ff75ae"
>

<span class="color-label">
好きな色にできるよ ♡
</span>

</div>

</div>


<div class="control">

<span class="control-title">
♡ 白ふちの太さ
</span>

<div class="row">

<input
id="outline"
type="range"
min="0"
max="35"
value="8"
>

<span
id="outlineValue"
class="value"
>
8px
</span>

</div>

</div>


<div class="control">

<span class="control-title">
♡ ネオン
</span>

<select id="glow">

<option value="none">
✦ ネオンなし
</option>

<option value="soft">
♡ ふんわりネオン
</option>

<option value="normal" selected>
💗 ネオン
</option>

<option value="strong">
✨ 強めネオン
</option>

</select>

</div>


<div class="control">

<span class="control-title">
♡ ネオンの色
</span>

<div class="row">

<input
id="glowColor"
type="color"
value="#ff75c8"
>

<span class="color-label">
光の色を選んでね ✨
</span>

</div>

</div>


<div class="control">

<span class="control-title">
♡ ネオンの強さ
</span>

<div class="row">

<input
id="glowPower"
type="range"
min="5"
max="50"
value="25"
>

<span
id="glowPowerValue"
class="value"
>
25
</span>

</div>

</div>


<label class="check">

<input
id="transparent"
type="checkbox"
checked
>

背景を透明にする ♡

</label>


<button
class="make"
onclick="draw()"
>
♡ 画像を作る ♡
</button>

</section>


<section class="card">

<label class="label">
♡ プレビュー
</label>

<div
id="preview"
class="preview transparent-view"
>

<canvas
id="canvas"
width="1200"
height="600"
></canvas>

</div>


<button
class="save"
onclick="saveImage()"
>
♡ PNG画像として保存する ♡
</button>

<div
id="message"
class="message"
></div>

</section>


<footer>
made with ♡ Cute-moji
</footer>

</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const text =
document.getElementById("text");

const font =
document.getElementById("font");

const size =
document.getElementById("size");

const sizeValue =
document.getElementById("sizeValue");

const color =
document.getElementById("color");

const outline =
document.getElementById("outline");

const outlineValue =
document.getElementById("outlineValue");

const glow =
document.getElementById("glow");

const glowColor =
document.getElementById("glowColor");

const glowPower =
document.getElementById("glowPower");

const glowPowerValue =
document.getElementById("glowPowerValue");

const transparent =
document.getElementById("transparent");

const fontPreview =
document.getElementById("fontPreview");

const preview =
document.getElementById("preview");

const message =
document.getElementById("message");


/* =========================
   フォントプレビュー
========================= */

function updateFontPreview() {

  fontPreview.style.fontFamily =
    `"${font.value}"`;

}


/* =========================
   改行
========================= */

function makeLines(
  value,
  maxWidth
) {

  const lines = [];

  let current = "";

  for (const char of value) {

    const test =
      current + char;

    if (
      ctx.measureText(test).width >
      maxWidth &&
      current !== ""
    ) {

      lines.push(current);

      current = char;

    } else {

      current = test;

    }

  }

  if (current) {
    lines.push(current);
  }

  return lines;

}


/* =========================
   ネオン
========================= */

function drawNeon(
  line,
  x,
  y,
  mode,
  power,
  neonColor
) {

  if (mode === "none") {
    return;
  }


  let outer;
  let middle;
  let inner;


  if (mode === "soft") {

    outer = power * 1.8;
    middle = power;
    inner = power * .45;

  }

  else if (mode === "strong") {

    outer = power * 3.2;
    middle = power * 1.8;
    inner = power * .8;

  }

  else {

    outer = power * 2.5;
    middle = power * 1.4;
    inner = power * .6;

  }


  /* 外側 */

  ctx.save();

  ctx.shadowColor =
    neonColor;

  ctx.shadowBlur =
    outer;

  ctx.fillStyle =
    neonColor;

  ctx.globalAlpha =
    .28;

  ctx.fillText(
    line,
    x,
    y
  );

  ctx.restore();


  /* 中間 */

  ctx.save();

  ctx.shadowColor =
    neonColor;

  ctx.shadowBlur =
    middle;

  ctx.fillStyle =
    neonColor;

  ctx.globalAlpha =
    .55;

  ctx.fillText(
    line,
    x,
    y
  );

  ctx.restore();


  /* 内側 */

  ctx.save();

  ctx.shadowColor =
    neonColor;

  ctx.shadowBlur =
    inner;

  ctx.fillStyle =
    "#ffffff";

  ctx.globalAlpha =
    .9;

  ctx.fillText(
    line,
    x,
    y
  );

  ctx.restore();

}


/* =========================
   描画
========================= */

async function draw() {

  await document.fonts.ready;


  /*
    Canvasを完全にクリアする。

    ここが重要。
    透明にしたい場合は
    白く塗らない。
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    背景を透明にしない場合だけ
    白背景を描く。
  */

  if (!transparent.checked) {

    ctx.fillStyle =
      "#fff7fb";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  /* フォント */

  const fontSize =
    Number(size.value);

  const fontName =
    font.value;

  ctx.font =
    `${fontSize}px "${fontName}"`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  const input =
    text.value.trim() ||
    "ここに文字が入るよ ♡";


  const lines =
    makeLines(
      input,
      1050
    );


  const lineHeight =
    fontSize * 1.45;

  const totalHeight =
    lines.length *
    lineHeight;

  const startY =
    canvas.height / 2 -
    totalHeight / 2 +
    lineHeight / 2;


  /*
    各行を描画
  */

  lines.forEach(
    (line,index) => {

      const x =
        canvas.width / 2;

      const y =
        startY +
        index * lineHeight;


      /*
        ① ネオン
      */

      drawNeon(
        line,
        x,
        y,
        glow.value,
        Number(glowPower.value),
        glowColor.value
      );


      /*
        ② 白ふち
      */

      const outlineSize =
        Number(outline.value);

      if (outlineSize > 0) {

        ctx.save();

        ctx.lineWidth =
          outlineSize;

        ctx.strokeStyle =
          "rgba(255,255,255,.98)";

        ctx.strokeText(
          line,
          x,
          y
        );

        ctx.restore();

      }


      /*
        ③ メイン文字
      */

      ctx.save();

      ctx.fillStyle =
        color.value;

      ctx.fillText(
        line,
        x,
        y
      );

      ctx.restore();

    });


  /*
    プレビュー背景だけ変更。

    Canvasそのものには
    背景を描いていない。
  */

  if (transparent.checked) {

    preview.classList.add(
      "transparent-view"
    );

    preview.classList.remove(
      "white-view"
    );

  } else {

    preview.classList.add(
      "white-view"
    );

    preview.classList.remove(
      "transparent-view"
    );

  }

}


/* =========================
   PNG保存
========================= */

function saveImage() {

  /*
    canvas.toDataURL() は
    Canvas内部の画像だけを保存する。

    プレビューのチェック柄は
    CSSなのでPNGには入らない。
  */

  const link =
    document.createElement("a");

  link.download =
    transparent.checked
      ? "Cute-moji-transparent.png"
      : "Cute-moji.png";

  link.href =
    canvas.toDataURL(
      "image/png"
    );

  link.click();


  message.textContent =
    transparent.checked
      ? "背景透明のPNGを保存したよ ♡"
      : "PNG画像を保存したよ ♡";


  setTimeout(
    () => {

      message.textContent = "";

    },
    2500
  );

}


/* =========================
   イベント
========================= */

text.addEventListener(
  "input",
  draw
);


font.addEventListener(
  "change",
  () => {

    updateFontPreview();

    draw();

  }
);


color.addEventListener(
  "input",
  draw
);


glow.addEventListener(
  "change",
  draw
);


glowColor.addEventListener(
  "input",
  draw
);


transparent.addEventListener(
  "change",
  draw
);


size.addEventListener(
  "input",
  () => {

    sizeValue.textContent =
      size.value + "px";

    draw();

  }
);


outline.addEventListener(
  "input",
  () => {

    outlineValue.textContent =
      outline.value + "px";

    draw();

  }
);


glowPower.addEventListener(
  "input",
  () => {

    glowPowerValue.textContent =
      glowPower.value;

    draw();

  }
);


/* =========================
   最初に実行
========================= */

document.fonts.ready.then(
  () => {

    updateFontPreview();

    draw();

  }
);

</script>

</body>
</html>
